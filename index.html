<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brewist Notes</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Brewist Notes">
<meta name="theme-color" content="#f6ecdf">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<script>
  // Apply saved Day/Night choice before the page draws (no flash)
  try { var t = localStorage.getItem('bn.theme'); if (t === '"light"' || t === '"dark"') document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
</script>
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<div class="awning" aria-hidden="true"></div>
<header class="top">
  <h1 class="sign"><img src="apple-touch-icon.png" alt="">Brewist Notes</h1>
  <nav class="tabs" role="tablist">
    <button class="tab on" data-tab="recipes" role="tab" aria-label="Recipes" title="Recipes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 7.5h8M8 11h8M8 14.5h5"/><path d="M14 16.5h4v1.2a2 2 0 0 1-2 2h0a2 2 0 0 1-2-2z" fill="currentColor" stroke="none"/></svg></button>
    <button class="tab" data-tab="talk" role="tab" aria-label="Customer talk" title="Customer talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11.5C4 7.4 7.6 4.5 12 4.5s8 2.9 8 7-3.6 7-8 7c-1 0-2-.1-2.9-.4L5 19.5l1.2-3.4C4.8 14.9 4 13.3 4 11.5z"/><circle cx="8.5" cy="11.5" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="11.5" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="11.5" r="1" fill="currentColor" stroke="none"/></svg></button>
    <button class="tab theme-btn" id="themeBtn" aria-label="Day / night" title="Day / night"></button>
  </nav>
</header>

<main>
  <section id="recipes" class="pane on">
    <div class="legend">
      <span class="chip hot">Hot = Coffee Mug · steamed milk / hot water</span>
      <span class="chip iced">Iced = Large Glass · Ice · cold milk / water</span>
    </div>
    <div class="colhead"><span class="h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11h11v4a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 12.5h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8.5 8c-1-1.3 1-2 0-3.5M12.5 8c-1-1.3 1-2 0-3.5"/></svg>Hot</span><span class="c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="6" width="11" height="11" rx="2.5" transform="rotate(-8 9.5 11.5)"/><rect x="11" y="10" width="9" height="9" rx="2" transform="rotate(10 15.5 14.5)"/><path d="M7 9.5l2-.3" stroke-linecap="round"/></svg>Iced</span></div>
    <div id="grid" class="grid"></div>
    <button id="unlockBtn" class="big-btn">+ Unlock a drink</button>
  </section>

  <section id="talk" class="pane">
    <div class="search-wrap">
      <input id="q" type="search" placeholder="Type a few words the customer said…" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="talk-tools">
      <span id="hint" class="hint"></span>
      <button id="addLineBtn" class="link-btn">+ Add a line</button>
    </div>
    <div id="results" class="results"></div>
  </section>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-bg" data-close></div>
  <div class="sheet-card" role="dialog" aria-modal="true">
    <button class="sheet-x" data-close aria-label="Close">×</button>
    <div id="sheetBody"></div>
  </div>
</div>

<script src="data.js?v=1"></script>
<script src="app.js?v=8"></script>
</body>
</html>
